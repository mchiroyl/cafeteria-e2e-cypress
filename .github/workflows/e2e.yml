name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cafe
          POSTGRES_PASSWORD: cafe
          POSTGRES_DB: cafeteria
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://cafe:cafe@localhost:5432/cafeteria
      PORT: 3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias raíz
        run: npm ci

      - name: Instalar dependencias backend
        working-directory: backend
        run: npm ci

      - name: Aplicar schema y seed
        run: |
          psql "$DATABASE_URL" -f backend/src/db/schema.sql
          psql "$DATABASE_URL" -f backend/src/db/seed.sql

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Iniciar backend
        working-directory: backend
        run: node dist/server.js &

      - name: Esperar que el backend esté listo
        run: npx wait-on http://localhost:3000/api/products --timeout 30000

      - name: Instalar dependencias frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Iniciar frontend preview
        working-directory: frontend
        run: npm run preview &

      - name: Ejecutar pruebas Cypress
        uses: cypress-io/github-action@v6
        with:
          install: false
          wait-on: 'http://localhost:5173'
          wait-on-timeout: 60

      - name: Subir evidencia si falla
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-evidence
          path: |
            cypress/screenshots
            cypress/videos
